# Perfil usado no servidor (Render). Ative com SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    hikari:
      # O pooler do Supabase (plano free) aceita poucas conexoes simultaneas
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.trainify.lms: INFO

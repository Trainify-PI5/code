server:
  port: ${PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: trainify-backend
  servlet:
    multipart:
      # "Criar curso com IA" recebe PDFs direto (o padrao do Spring e 1 MB).
      # Os numeros acompanham os limites de CourseGenerationService, que existem
      # para o envio caber na memoria da instancia.
      max-file-size: 10MB
      max-request-size: 18MB
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trainify_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    clear-checksums: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # IA (Spring AI). A Groq aceita o mesmo formato de pedido da API da OpenAI, entao
  # usamos o modulo "openai" do Spring AI apontando para o endereco da Groq.
  # Detalhes em docs/ia-no-trainify.md.
  ai:
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      # Sem a chave o sistema sobe normalmente e so os recursos de IA ficam
      # desligados (o valor de fachada evita que o Spring AI recuse a subida).
      api-key: ${GROQ_API_KEY:sem-chave}
    # A Groq so oferece chat. Os outros modelos que o modulo "openai" criaria
    # (embeddings, imagem, audio, moderacao) ficam desligados.
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # Falha passageira da Groq (erro 5xx): uma nova tentativa, sem fazer a
    # pessoa esperar minutos. Limite de uso (429) nao e repetido aqui.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        max-interval: 4s
  http:
    client:
      connect-timeout: 10s
      read-timeout: 90s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:no-reply@trainify.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

logging:
  level:
    org.springframework.security: DEBUG
    com.trainify.lms: DEBUG

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  recaptcha:
    # Protecao anti-robo no login. Desligada por padrao: sem a chave secreta
    # definida, o login funciona como sempre. Para ligar, defina RECAPTCHA_ENABLED=true
    # e RECAPTCHA_SECRET_KEY com a chave do Google (par do site-key usado no front).
    enabled: ${RECAPTCHA_ENABLED:false}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    # So e cobrado no reCAPTCHA v3 (invisivel, por score). No v2 (checkbox) e ignorado.
    min-score: ${RECAPTCHA_MIN_SCORE:0.5}
    verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
  ai:
    # Chave da Groq (console.groq.com/keys). Vazia: recursos de IA desligados.
    groq-api-key: ${GROQ_API_KEY:}
    # Cada recurso de IA tem a propria configuracao do modelo, como no notebook
    # da disciplina: modelo, temperatura, limite de tokens da resposta e esforco
    # de raciocinio (os modelos gpt-oss aceitam low, medium e high).
    chat:
      modelo: ${IA_CHAT_MODELO:openai/gpt-oss-20b}
      temperatura: 0.3
      max-tokens: 1500
      raciocinio: low
    quiz:
      modelo: ${IA_QUIZ_MODELO:openai/gpt-oss-120b}
      temperatura: 0.2
      max-tokens: 4000
      raciocinio: low
    curso-estrutura:
      modelo: ${IA_CURSO_MODELO:openai/gpt-oss-120b}
      temperatura: 0.2
      max-tokens: 3000
      raciocinio: low
    # O texto das aulas usa outro modelo de proposito: o limite de tokens por
    # minuto da Groq e por modelo, entao gerar um curso nao tira a cota do chat.
    # O Qwen aceita desligar o raciocinio (reasoning_effort "none", como no notebook).
    curso-aula:
      modelo: ${IA_AULA_MODELO:qwen/qwen3.8-27b}
      temperatura: 0.4
      max-tokens: 2000
      raciocinio: none
    # Prepara o texto das aulas que ainda nao passaram pela IA (ex.: aulas
    # criadas antes desta versao). As novas sao preparadas ao salvar.
    sync:
      enabled: ${IA_SYNC_ENABLED:true}
  s3:
    bucket: ${AWS_S3_BUCKET:trainify-media}
    region: ${AWS_S3_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    path-style: ${AWS_S3_PATH_STYLE:true}

resilience4j.circuitbreaker:
  instances:
    iaChat:
      registerHealthIndicator: true
      slidingWindowSize: 5
      minimumNumberOfCalls: 3
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 10s
      failureRateThreshold: 50
      # Erros do proprio pedido nao indicam que a IA caiu
      ignoreExceptions:
        - java.lang.IllegalArgumentException
        - jakarta.persistence.EntityNotFoundException
        - org.springframework.security.access.AccessDeniedException
        - com.trainify.lms.ai.AiContentMissingException


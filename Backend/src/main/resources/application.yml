server:
  port: ${PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: trainify-backend
  servlet:
    multipart:
      # "Criar curso com IA" recebe PDFs direto (o padrao do Spring e 1 MB).
      # Os numeros acompanham os limites de CourseGenerationService, que existem
      # para o envio caber na memoria da instancia.
      max-file-size: 10MB
      max-request-size: 18MB
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trainify_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    clear-checksums: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:no-reply@trainify.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

logging:
  level:
    org.springframework.security: DEBUG
    com.trainify.lms: DEBUG

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  ai:
    # Microservico de IA (trainify-ai): chat com RAG e geracao de quiz
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    # Mesma chave definida em INTERNAL_API_KEY no .env do trainify-ai
    internal-key: ${AI_INTERNAL_KEY:}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:120}
  s3:
    bucket: ${AWS_S3_BUCKET:trainify-media}
    region: ${AWS_S3_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    path-style: ${AWS_S3_PATH_STYLE:true}

resilience4j.circuitbreaker:
  instances:
    iaChat:
      registerHealthIndicator: true
      slidingWindowSize: 5
      minimumNumberOfCalls: 3
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 10s
      failureRateThreshold: 50
      # Erros do proprio pedido nao indicam que a IA caiu
      ignoreExceptions:
        - java.lang.IllegalArgumentException
        - jakarta.persistence.EntityNotFoundException
        - org.springframework.security.access.AccessDeniedException
        - com.trainify.lms.ai.AiContentMissingException


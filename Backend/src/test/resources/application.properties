# Configuracao usada apenas pelos testes.
#
# O teste de contexto (TrainifyBackendApplicationTests) existe para provar que a
# aplicacao consegue subir: fiacao de beans, expressoes de permissao, consultas
# dos repositorios e configuracao dos clientes externos. Ele falhava sempre por
# falta de banco, entao o CI o excluia — e ninguem mais verificava a subida.
#
# Aqui o banco e um H2 em memoria e nada toca o esquema: as migracoes ficam
# desligadas e o Hibernate nao valida nem cria tabelas. O objetivo nao e exercitar
# SQL, e sim garantir que o contexto do Spring fecha.

spring.datasource.url=jdbc:h2:mem:trainify;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false

# Valores de fachada: nenhum teste faz chamada externa de verdade.
# A chave JWT precisa de 32 caracteres ou mais por exigencia do algoritmo HS256.
app.jwt.secret=chave-de-teste-sem-valor-algum-apenas-para-o-contexto-subir
app.s3.access-key=teste
app.s3.secret-key=teste
app.ai.service-url=http://localhost:9999
app.ai.internal-key=

# A sincronizacao do indice da IA chamaria o microservico; nos testes fica parada.
app.ai.sync.enabled=false

logging.level.org.springframework.security=WARN
logging.level.com.trainify.lms=WARN

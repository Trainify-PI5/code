name: Mantem a API acordada

# O plano gratuito do Render hiberna o servico apos 15 minutos sem uso, e acordar
# leva de 3 a 4 minutos.
#
# Agendamento a cada 10 minutos nao funciona: o GitHub desprioriza tarefas
# agendadas e chega a rodar so a cada 4 ou 7 horas. Por isso cada execucao fica
# viva por quase 6 horas (o maximo permitido) fazendo ping de 5 em 5 minutos.
# Assim, mesmo com a fila do GitHub atrasando, a cobertura e continua.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Uma execucao por vez: a proxima entra na fila e assume quando esta terminar
concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping a cada 5 minutos
        run: |
          URL="https://trainify-api-p2ka.onrender.com/api/v1/health"
          FIM=$(( $(date +%s) + 350 * 60 ))

          while [ "$(date +%s)" -lt "$FIM" ]; do
            CODIGO=$(curl -sS -m 300 -o /tmp/health.json -w "%{http_code}" "$URL" || echo "000")
            echo "$(date -u +%H:%M:%S) HTTP $CODIGO $(cat /tmp/health.json 2>/dev/null | head -c 120)"
            sleep 300
          done
